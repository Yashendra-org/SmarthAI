<div class="policy-card position-relative">
  <h3><a class="stretched stretched-link" href="{{ p.get_absolute_url }}">{{ p.title }}</a></h3>
  <p class="verified mb-2">{{ p.department }} &middot; {{ p.get_level_display }}{% if p.state %}, {{ p.state }}{% endif %}</p>
  <p class="mb-2">{{ p.objective }}</p>
  <div>{% for g in p.target_groups.all %}<span class="tag">{{ g.name|title }}</span>{% endfor %}</div>
</div>
