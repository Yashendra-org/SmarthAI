<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="40" height="40">
  <defs>
    <linearGradient id="blNavyTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c7b"/>
      <stop offset="100%" stop-color="#16324f"/>
    </linearGradient>
    <linearGradient id="blSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="100%" stop-color="#f2a900"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="36" height="36" rx="10" fill="url(#blNavyTeal)"/>
  <rect x="3" y="3" width="34" height="34" rx="9" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.3"/>
  <g transform="translate(20, 20)">
    <circle r="12" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.95"/>
    <circle r="7.5" fill="none" stroke="#68d8d6" stroke-width="0.8" stroke-opacity="0.7"/>
    <!-- 8 Primary cardinal & ordinal spokes for clean small-scale display -->
    <g stroke="#ffffff" stroke-width="1" stroke-linecap="round" stroke-opacity="0.9">
      <line x1="0" y1="-12" x2="0" y2="-7.5"/>
      <line x1="8.5" y1="-8.5" x2="5.3" y2="-5.3"/>
      <line x1="12" y1="0" x2="7.5" y2="0"/>
      <line x1="8.5" y1="8.5" x2="5.3" y2="5.3"/>
      <line x1="0" y1="12" x2="0" y2="7.5"/>
      <line x1="-8.5" y1="8.5" x2="-5.3" y2="5.3"/>
      <line x1="-12" y1="0" x2="-7.5" y2="0"/>
      <line x1="-8.5" y1="-8.5" x2="-5.3" y2="-5.3"/>
    </g>
    <circle r="3.2" fill="#16324f" stroke="#ffffff" stroke-width="0.8"/>
    <circle r="1.6" fill="url(#blSaffron)"/>
