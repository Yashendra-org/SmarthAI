<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="gradNavyTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e7c7b"/>
      <stop offset="100%" stop-color="#16324f"/>
    </linearGradient>
    <linearGradient id="gradSaffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9933"/>
      <stop offset="100%" stop-color="#f2a900"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0c1c2e" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Outer Civic Shield -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#gradNavyTeal)" filter="url(#shadow)"/>
  <rect x="8" y="8" width="104" height="104" rx="26" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3"/>
  
  <!-- Modern 24-Spoke Civic Wheel / Compass Mark -->
  <g transform="translate(60, 60)">
    <!-- Outer Ring -->
    <circle r="36" fill="none" stroke="#ffffff" stroke-width="3" stroke-opacity="0.95"/>
    <!-- Subtle Inner Ring -->
    <circle r="22" fill="none" stroke="#68d8d6" stroke-width="1.5" stroke-opacity="0.75"/>
    
    <!-- Precision Spokes -->
    <g stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.85">
      <!-- 24 Spokes rendered geometrically at 15 degree intervals -->
      <line x1="0" y1="-36" x2="0" y2="-22"/>
      <line x1="9.3" y1="-34.8" x2="5.7" y2="-21.2"/>
      <line x1="18" y1="-31.2" x2="11" y2="-19.1"/>
      <line x1="25.5" y1="-25.5" x2="15.6" y2="-15.6"/>
      <line x1="31.2" y1="-18" x2="19.1" y2="-11"/>
      <line x1="34.8" y1="-9.3" x2="21.2" y2="-5.7"/>
      <line x1="36" y1="0" x2="22" y2="0"/>
      <line x1="34.8" y1="9.3" x2="21.2" y2="5.7"/>
      <line x1="31.2" y1="18" x2="19.1" y2="11"/>
      <line x1="25.5" y1="25.5" x2="15.6" y2="15.6"/>
      <line x1="18" y1="31.2" x2="11" y2="19.1"/>
      <line x1="9.3" y1="34.8" x2="5.7" y2="21.2"/>
      <line x1="0" y1="36" x2="0" y2="22"/>
      <line x1="-9.3" y1="34.8" x2="-5.7" y2="21.2"/>
      <line x1="-18" y1="31.2" x2="-11" y2="19.1"/>
      <line x1="-25.5" y1="25.5" x2="-15.6" y2="15.6"/>
      <line x1="-31.2" y1="18" x2="-19.1" y2="11"/>
      <line x1="-34.8" y1="9.3" x2="-21.2" y2="5.7"/>
      <line x1="-36" y1="0" x2="-22" y2="0"/>
      <line x1="-34.8" y1="-9.3" x2="-21.2" y2="-5.7"/>
      <line x1="-31.2" y1="-18" x2="-19.1" y2="-11"/>
      <line x1="-25.5" y1="-25.5" x2="-15.6" y2="-15.6"/>
      <line x1="-18" y1="-31.2" x2="-11" y2="-19.1"/>
      <line x1="-9.3" y1="-34.8" x2="-5.7" y2="-21.2"/>
    </g>

    <!-- Hub Disc & Saffron Center Point -->
    <circle r="9" fill="#16324f" stroke="#ffffff" stroke-width="2"/>
    <circle r="4.5" fill="url(#gradSaffron)"/>
  </g>
</svg>