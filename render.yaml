services:
  - type: web
    name: smarthai
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SENTIMENT_ENGINE
        value: "lexicon"
      - key: MIN_RESPONSES_FOR_CHART
        value: "10"
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: ADMIN_PASSWORD
        value: "admin123"
