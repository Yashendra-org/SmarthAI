name: Automated Government Schemes Ingestion Pipeline

on:
  schedule:
    # Runs every 24 hours at 00:30 UTC (06:00 AM IST)
    - cron: '30 0 * * *'
  workflow_dispatch:
    inputs:
      auto_publish:
        description: 'Auto-publish to live (true) or save as Draft (false)'
        required: false
        default: 'false'
        type: boolean
      limit:
        description: 'Max candidates per ministry source'
        required: false
        default: '5'
        type: string

jobs:
  ingest-schemes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Automated Government Schemes Ingestion & Expiry Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATA_GOV_API_KEY: ${{ secrets.DATA_GOV_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'github-actions-secret-key-for-pipeline' }}
        run: |
          python scripts/automated_scheme_pipeline.py --limit ${{ github.event.inputs.limit || '3' }} ${{ (github.event.inputs.auto_publish == 'true') && '--auto-publish' || '' }} --check-expiry
